<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">Search Console URL Inspection example</title>
  <desc id="desc">A mock URL Inspection panel showing coverage, canonical, crawl and indexing details.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#ecfdf5"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#0f172a" flood-opacity=".10"/>
    </filter>
  </defs>

  <rect width="1200" height="700" fill="url(#bg)"/>
  <rect x="40" y="30" width="1120" height="640" rx="18" fill="#ffffff" stroke="#e2e8f0" filter="url(#shadow)"/>

  <rect x="40" y="30" width="1120" height="46" rx="18" fill="#f8fafc"/>
  <rect x="40" y="58" width="1120" height="18" fill="#f8fafc"/>
  <line x1="40" y1="76" x2="1160" y2="76" stroke="#e2e8f0"/>
  <circle cx="68" cy="53" r="5" fill="#fda4af"/>
  <circle cx="86" cy="53" r="5" fill="#fcd34d"/>
  <circle cx="104" cy="53" r="5" fill="#86efac"/>
  <rect x="132" y="42" width="430" height="22" rx="11" fill="#eef2f7"/>
  <text x="150" y="57" font-family="Inter, Segoe UI, sans-serif" font-size="11" fill="#64748b">search.google.com/search-console/inspect</text>

  <text x="70" y="116" font-family="Inter, Segoe UI, sans-serif" font-size="21" font-weight="700" fill="#0f172a">URL Inspection</text>
  <rect x="90" y="136" width="1010" height="42" rx="21" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="112" y="162" font-family="Inter, Segoe UI, sans-serif" font-size="12" fill="#334155">https://example.com/guides/search-console-indexing/</text>
  <rect x="936" y="143" width="148" height="28" rx="14" fill="#4f46e5"/>
  <text x="1010" y="162" font-family="Inter, Segoe UI, sans-serif" font-size="11" font-weight="600" fill="#ffffff" text-anchor="middle">Test live URL</text>

  <!-- Coverage card -->
  <rect x="70" y="204" width="500" height="118" rx="14" fill="#f0fdf4" stroke="#bbf7d0"/>
  <circle cx="100" cy="238" r="14" fill="#22c55e"/>
  <path d="M93 238l5 5 10-11" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="126" y="234" font-family="Inter, Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#14532d">URL is on Google</text>
  <text x="126" y="253" font-family="Inter, Segoe UI, sans-serif" font-size="11" fill="#166534">Indexed · Last crawled May 24, 2026</text>
  <line x1="92" y1="272" x2="548" y2="272" stroke="#bbf7d0"/>
  <text x="92" y="296" font-family="Inter, Segoe UI, sans-serif" font-size="11" fill="#166534">Canonical: https://example.com/guides/search-console-indexing/ (self)</text>

  <rect x="590" y="204" width="510" height="118" rx="14" fill="#eef2ff" stroke="#c7d2fe"/>
  <text x="612" y="232" font-family="Inter, Segoe UI, sans-serif" font-size="11" font-weight="700" fill="#4338ca">PAGE AVAILABILITY</text>
  <text x="612" y="258" font-family="Inter, Segoe UI, sans-serif" font-size="12" fill="#1e1b4b">Crawl allowed: Yes · Page fetch: Successful</text>
  <text x="612" y="281" font-family="Inter, Segoe UI, sans-serif" font-size="12" fill="#1e1b4b">Indexing allowed: Yes · Robots.txt: Allowed</text>
  <text x="612" y="304" font-family="Inter, Segoe UI, sans-serif" font-size="11" fill="#6366f1">HTTP response: 200 OK</text>

  <!-- Indexing request -->
  <rect x="70" y="344" width="1030" height="72" rx="12" fill="#fffbeb" stroke="#fde68a"/>
  <text x="92" y="372" font-family="Inter, Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#92400e">Testing the live URL</text>
  <text x="92" y="394" font-family="Inter, Segoe UI, sans-serif" font-size="11" fill="#a16207">Live test fetches the page now. It does not change what is currently indexed.</text>

  <!-- Details grid -->
  <g font-family="Inter, Segoe UI, sans-serif">
    <text x="70" y="454" font-size="13" font-weight="700" fill="#0f172a">Indexing details</text>

    <rect x="70" y="470" width="330" height="150" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="90" y="496" font-size="11" font-weight="700" fill="#64748b">DISCOVERY</text>
    <text x="90" y="522" font-size="11" fill="#334155">Sitemap: /sitemap.xml</text>
    <text x="90" y="544" font-size="11" fill="#334155">Referring page: /guides/</text>
    <text x="90" y="566" font-size="11" fill="#334155">Last crawl: May 24, 2026 08:41</text>
    <text x="90" y="588" font-size="11" fill="#334155">Crawl type: Desktop</text>

    <rect x="420" y="470" width="330" height="150" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="440" y="496" font-size="11" font-weight="700" fill="#64748b">CANONICAL</text>
    <text x="440" y="522" font-size="11" fill="#334155">Google-selected: Same as user</text>
    <text x="440" y="544" font-size="11" fill="#334155">User-declared: Self</text>
    <text x="440" y="566" font-size="11" fill="#334155">Alternate: None</text>
    <text x="440" y="588" font-size="11" fill="#334155">Reason: Page is indexable</text>

    <rect x="770" y="470" width="330" height="150" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="790" y="496" font-size="11" font-weight="700" fill="#64748b">ENHANCEMENTS</text>
    <text x="790" y="522" font-size="11" fill="#334155">Breadcrumbs: Valid</text>
    <text x="790" y="544" font-size="11" fill="#334155">Article: Valid</text>
    <text x="790" y="566" font-size="11" fill="#334155">FAQ: Not detected</text>
    <text x="790" y="588" font-size="11" fill="#334155">Mobile usability: Passed</text>
  </g>

  <text x="70" y="650" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#94a3b8">Mock data for training. Search Console screens change over time; focus on the information, not the exact layout.</text>
</svg>
