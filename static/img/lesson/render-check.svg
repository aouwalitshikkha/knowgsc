<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">Raw HTML versus rendered content comparison</title>
  <desc id="desc">A mock comparison of raw HTML and rendered page content for a JavaScript-rendered guide page.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#eef2ff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#0f172a" flood-opacity=".10"/>
    </filter>
  </defs>

  <rect width="1200" height="700" fill="url(#bg)"/>
  <rect x="40" y="30" width="1120" height="640" rx="18" fill="#ffffff" stroke="#e2e8f0" filter="url(#shadow)"/>

  <rect x="40" y="30" width="1120" height="46" rx="18" fill="#f8fafc"/>
  <rect x="40" y="58" width="1120" height="18" fill="#f8fafc"/>
  <line x1="40" y1="76" x2="1160" y2="76" stroke="#e2e8f0"/>
  <circle cx="68" cy="53" r="5" fill="#fda4af"/>
  <circle cx="86" cy="53" r="5" fill="#fcd34d"/>
  <circle cx="104" cy="53" r="5" fill="#86efac"/>
  <rect x="132" y="42" width="430" height="22" rx="11" fill="#eef2f7"/>
  <text x="150" y="57" font-family="Inter, Segoe UI, sans-serif" font-size="11" fill="#64748b">search.google.com/search-console/inspect · rendered page</text>

  <text x="70" y="116" font-family="Inter, Segoe UI, sans-serif" font-size="21" font-weight="700" fill="#0f172a">Rendering check</text>
  <text x="70" y="140" font-family="Inter, Segoe UI, sans-serif" font-size="11" fill="#64748b">Compare what Googlebot fetched with what the browser displays.</text>

  <!-- Left: raw HTML -->
  <rect x="70" y="168" width="510" height="470" rx="14" fill="#0f172a"/>
  <text x="92" y="196" font-family="Inter, Segoe UI, sans-serif" font-size="11" font-weight="700" fill="#94a3b8">RAW HTML (NO JAVASCRIPT)</text>
  <g font-family="Consolas, monospace" font-size="11">
    <text x="92" y="228" fill="#93c5fd">&lt;!DOCTYPE html&gt;</text>
    <text x="92" y="250" fill="#93c5fd">&lt;html lang="en"&gt;</text>
    <text x="92" y="272" fill="#93c5fd">&lt;head&gt;</text>
    <text x="92" y="294" fill="#fca5a5">&lt;link rel="canonical" href="/guides/gsc/"&gt;</text>
    <text x="92" y="316" fill="#86efac">&lt;meta name="robots" content="index,follow"&gt;</text>
    <text x="92" y="338" fill="#93c5fd">&lt;/head&gt;</text>
    <text x="92" y="360" fill="#93c5fd">&lt;body&gt;</text>
    <text x="92" y="382" fill="#e2e8f0">&lt;div id="root"&gt;&lt;/div&gt;</text>
    <text x="92" y="404" fill="#fbbf24">&lt;!-- content is rendered by app.js --&gt;</text>
    <text x="92" y="426" fill="#93c5fd">&lt;/body&gt;</text>
    <text x="92" y="448" fill="#93c5fd">&lt;/html&gt;</text>
  </g>
  <rect x="92" y="484" width="466" height="58" rx="10" fill="#1e293b"/>
  <text x="112" y="507" font-family="Inter, Segoe UI, sans-serif" font-size="11" font-weight="600" fill="#fca5a5">Problem</text>
  <text x="112" y="526" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#cbd5e1">No main content, no H1 and no article body until JavaScript runs.</text>
  <text x="92" y="580" font-family="Inter, Segoe UI, sans-serif" font-size="11" fill="#86efac">Canonical + robots directives are present in the raw HTML.</text>
  <text x="92" y="606" font-family="Inter, Segoe UI, sans-serif" font-size="11" fill="#fbbf24">Rendering depends on /static/app.js and /api/content.</text>

  <!-- Right: rendered -->
  <rect x="620" y="168" width="510" height="470" rx="14" fill="#ffffff" stroke="#e2e8f0"/>
  <rect x="620" y="168" width="510" height="40" rx="14" fill="#f8fafc"/>
  <rect x="620" y="194" width="510" height="14" fill="#f8fafc"/>
  <line x1="620" y1="208" x2="1130" y2="208" stroke="#e2e8f0"/>
  <circle cx="644" cy="188" r="4" fill="#cbd5e1"/>
  <circle cx="658" cy="188" r="4" fill="#cbd5e1"/>
  <circle cx="672" cy="188" r="4" fill="#cbd5e1"/>
  <rect x="696" y="179" width="300" height="18" rx="9" fill="#eef2f7"/>
  <text x="710" y="192" font-family="Inter, Segoe UI, sans-serif" font-size="9" fill="#64748b">example.com/guides/gsc/</text>

  <text x="648" y="248" font-family="Inter, Segoe UI, sans-serif" font-size="10" font-weight="700" fill="#4f46e5">GUIDE</text>
  <text x="648" y="278" font-family="Inter, Segoe UI, sans-serif" font-size="20" font-weight="700" fill="#0f172a">Search Console indexing</text>
  <text x="648" y="300" font-family="Inter, Segoe UI, sans-serif" font-size="20" font-weight="700" fill="#0f172a">explained</text>

  <rect x="648" y="322" width="454" height="7" rx="3.5" fill="#e2e8f0"/>
  <rect x="648" y="340" width="430" height="7" rx="3.5" fill="#e2e8f0"/>
  <rect x="648" y="358" width="446" height="7" rx="3.5" fill="#e2e8f0"/>
  <rect x="648" y="376" width="380" height="7" rx="3.5" fill="#e2e8f0"/>

  <rect x="648" y="406" width="454" height="96" rx="12" fill="#eef2ff"/>
  <text x="666" y="430" font-family="Inter, Segoe UI, sans-serif" font-size="11" font-weight="700" fill="#4338ca">Why a crawled page is not indexed</text>
  <rect x="666" y="444" width="380" height="6" rx="3" fill="#c7d2fe"/>
  <rect x="666" y="458" width="410" height="6" rx="3" fill="#c7d2fe"/>
  <rect x="666" y="472" width="330" height="6" rx="3" fill="#c7d2fe"/>

  <text x="648" y="536" font-family="Inter, Segoe UI, sans-serif" font-size="11" font-weight="700" fill="#0f172a">Canonical signal</text>
  <rect x="648" y="550" width="454" height="48" rx="10" fill="#f0fdf4" stroke="#bbf7d0"/>
  <text x="666" y="570" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#166534">Rendered canonical matches raw HTML and sitemap.</text>
  <text x="666" y="586" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#166534">H1 and body content are visible after rendering.</text>

  <text x="70" y="662" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#94a3b8">Mock data for training. Always test with URL Inspection and a no-JavaScript fetch.</text>
</svg>
