<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">Search Console Pages report example</title>
  <desc id="desc">A mock Pages report showing indexed versus not indexed URL counts and common exclusion reasons.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#fff7ed"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#0f172a" flood-opacity=".10"/>
    </filter>
  </defs>

  <rect width="1200" height="700" fill="url(#bg)"/>
  <rect x="40" y="30" width="1120" height="640" rx="18" fill="#ffffff" stroke="#e2e8f0" filter="url(#shadow)"/>

  <rect x="40" y="30" width="1120" height="46" rx="18" fill="#f8fafc"/>
  <rect x="40" y="58" width="1120" height="18" fill="#f8fafc"/>
  <line x1="40" y1="76" x2="1160" y2="76" stroke="#e2e8f0"/>
  <circle cx="68" cy="53" r="5" fill="#fda4af"/>
  <circle cx="86" cy="53" r="5" fill="#fcd34d"/>
  <circle cx="104" cy="53" r="5" fill="#86efac"/>
  <rect x="132" y="42" width="430" height="22" rx="11" fill="#eef2f7"/>
  <text x="150" y="57" font-family="Inter, Segoe UI, sans-serif" font-size="11" fill="#64748b">search.google.com/search-console/index</text>

  <text x="70" y="116" font-family="Inter, Segoe UI, sans-serif" font-size="21" font-weight="700" fill="#0f172a">Page indexing</text>
  <text x="70" y="140" font-family="Inter, Segoe UI, sans-serif" font-size="11" fill="#64748b">Why pages aren’t indexed · Last updated May 26, 2026</text>

  <!-- Donut -->
  <g transform="translate(220 310)">
    <circle r="118" fill="none" stroke="#e2e8f0" stroke-width="34"/>
    <circle r="118" fill="none" stroke="#22c55e" stroke-width="34" stroke-dasharray="520 741" stroke-dashoffset="0" transform="rotate(-90)"/>
    <circle r="118" fill="none" stroke="#f59e0b" stroke-width="34" stroke-dasharray="148 741" stroke-dashoffset="-520" transform="rotate(-90)"/>
    <circle r="118" fill="none" stroke="#f43f5e" stroke-width="34" stroke-dasharray="73 741" stroke-dashoffset="-668" transform="rotate(-90)"/>
    <text y="-4" text-anchor="middle" font-family="Inter, Segoe UI, sans-serif" font-size="34" font-weight="700" fill="#0f172a">1,284</text>
    <text y="22" text-anchor="middle" font-family="Inter, Segoe UI, sans-serif" font-size="11" fill="#64748b">Indexed URLs</text>
  </g>

  <g font-family="Inter, Segoe UI, sans-serif" font-size="11">
    <rect x="96" y="470" width="10" height="10" rx="2" fill="#22c55e"/>
    <text x="114" y="479" fill="#334155">Indexed</text>
    <rect x="186" y="470" width="10" height="10" rx="2" fill="#f59e0b"/>
    <text x="204" y="479" fill="#334155">Not indexed</text>
    <rect x="292" y="470" width="10" height="10" rx="2" fill="#f43f5e"/>
    <text x="310" y="479" fill="#334155">Errors</text>
  </g>

  <!-- Summary cards -->
  <g font-family="Inter, Segoe UI, sans-serif">
    <rect x="430" y="178" width="220" height="96" rx="12" fill="#f0fdf4" stroke="#bbf7d0"/>
    <text x="450" y="204" font-size="11" fill="#15803d">Indexed</text>
    <text x="450" y="238" font-size="27" font-weight="700" fill="#14532d">1,284</text>
    <text x="450" y="258" font-size="10" fill="#16a34a">▲ 0.5% vs previous period</text>

    <rect x="670" y="178" width="220" height="96" rx="12" fill="#fffbeb" stroke="#fde68a"/>
    <text x="690" y="204" font-size="11" fill="#b45309">Not indexed</text>
    <text x="690" y="238" font-size="27" font-weight="700" fill="#78350f">221</text>
    <text x="690" y="258" font-size="10" fill="#d97706">42 discovered · 7 crawled</text>

    <rect x="910" y="178" width="190" height="96" rx="12" fill="#fff1f2" stroke="#fecdd3"/>
    <text x="930" y="204" font-size="11" fill="#be123c">Errors</text>
    <text x="930" y="238" font-size="27" font-weight="700" fill="#881337">3</text>
    <text x="930" y="258" font-size="10" fill="#e11d48">2 server · 1 redirect</text>
  </g>

  <!-- Reason list -->
  <g font-family="Inter, Segoe UI, sans-serif">
    <text x="430" y="316" font-size="12" font-weight="700" fill="#0f172a">Why pages aren’t indexed</text>

    <rect x="430" y="332" width="670" height="54" rx="10" fill="#fff7ed" stroke="#fed7aa"/>
    <text x="450" y="355" font-size="12" font-weight="600" fill="#7c2d12">Discovered – currently not indexed</text>
    <text x="450" y="374" font-size="10" fill="#9a3412">Known URL, not yet crawled or selected</text>
    <text x="1072" y="365" font-size="16" font-weight="700" fill="#c2410c" text-anchor="end">42</text>

    <rect x="430" y="396" width="670" height="54" rx="10" fill="#fff7ed" stroke="#fed7aa"/>
    <text x="450" y="419" font-size="12" font-weight="600" fill="#7c2d12">Crawled – currently not indexed</text>
    <text x="450" y="438" font-size="10" fill="#9a3412">Fetched, but not selected for the index</text>
    <text x="1072" y="429" font-size="16" font-weight="700" fill="#c2410c" text-anchor="end">7</text>

    <rect x="430" y="460" width="670" height="54" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="450" y="483" font-size="12" font-weight="600" fill="#334155">Alternate page with proper canonical tag</text>
    <text x="450" y="502" font-size="10" fill="#64748b">Google chose a different canonical URL</text>
    <text x="1072" y="493" font-size="16" font-weight="700" fill="#475569" text-anchor="end">164</text>

    <rect x="430" y="524" width="670" height="54" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="450" y="547" font-size="12" font-weight="600" fill="#334155">Excluded by ‘noindex’ tag</text>
    <text x="450" y="566" font-size="10" fill="#64748b">Directive intentionally keeps the URL out</text>
    <text x="1072" y="557" font-size="16" font-weight="700" fill="#475569" text-anchor="end">8</text>
  </g>

  <text x="70" y="650" font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#94a3b8">Mock data for training. Counts are illustrative; always verify a sample with URL Inspection.</text>
</svg>
