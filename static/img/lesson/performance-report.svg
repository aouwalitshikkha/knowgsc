<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">Search Console Performance report example</title>
  <desc id="desc">A mock Search Console Performance report with query filters and a clicks and impressions chart.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#eef2ff"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#6366f1" stop-opacity=".25"/>
      <stop offset="1" stop-color="#818cf8" stop-opacity=".9"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#0f172a" flood-opacity=".10"/>
    </filter>
  </defs>

  <rect width="1200" height="700" fill="url(#bg)"/>
  <rect x="40" y="30" width="1120" height="640" rx="18" fill="#ffffff" stroke="#e2e8f0" filter="url(#shadow)"/>

  <!-- Browser bar -->
  <rect x="40" y="30" width="1120" height="46" rx="18" fill="#f8fafc"/>
  <rect x="40" y="58" width="1120" height="18" fill="#f8fafc"/>
  <line x1="40" y1="76" x2="1160" y2="76" stroke="#e2e8f0"/>
  <circle cx="68" cy="53" r="5" fill="#fda4af"/>
  <circle cx="86" cy="53" r="5" fill="#fcd34d"/>
  <circle cx="104" cy="53" r="5" fill="#86efac"/>
  <rect x="132" y="42" width="430" height="22" rx="11" fill="#eef2f7"/>
  <text x="150" y="57" font-family="Inter, Segoe UI, sans-serif" font-size="11" fill="#64748b">search.google.com/search-console/performance</text>

  <!-- Header -->
  <text x="70" y="116" font-family="Inter, Segoe UI, sans-serif" font-size="21" font-weight="700" fill="#0f172a">Performance</text>
  <rect x="930" y="96" width="200" height="30" rx="15" fill="#f1f5f9" stroke="#e2e8f0"/>
  <text x="948" y="116" font-family="Inter, Segoe UI, sans-serif" font-size="11" fill="#475569">https://knowgsc.example</text>
  <text x="1084" y="116" font-family="Inter, Segoe UI, sans-serif" font-size="11" fill="#94a3b8">▾</text>

  <!-- Tabs -->
  <text x="70" y="148" font-family="Inter, Segoe UI, sans-serif" font-size="12" font-weight="600" fill="#4338ca">Performance</text>
  <line x1="70" y1="158" x2="154" y2="158" stroke="#4f46e5" stroke-width="2"/>
  <text x="184" y="148" font-family="Inter, Segoe UI, sans-serif" font-size="12" fill="#64748b">URL Inspection</text>
  <text x="300" y="148" font-family="Inter, Segoe UI, sans-serif" font-size="12" fill="#64748b">Indexing</text>
  <text x="382" y="148" font-family="Inter, Segoe UI, sans-serif" font-size="12" fill="#64748b">Sitemaps</text>
  <line x1="40" y1="168" x2="1160" y2="168" stroke="#e2e8f0"/>

  <!-- Metric cards -->
  <g font-family="Inter, Segoe UI, sans-serif">
    <rect x="70" y="190" width="250" height="86" rx="12" fill="#eef2ff"/>
    <text x="88" y="214" font-size="11" fill="#4f46e5">Total clicks</text>
    <text x="88" y="246" font-size="26" font-weight="700" fill="#1e1b4b">18.4K</text>
    <text x="200" y="246" font-size="11" fill="#059669">▲ 12.6%</text>

    <rect x="336" y="190" width="250" height="86" rx="12" fill="#ecfeff"/>
    <text x="354" y="214" font-size="11" fill="#0e7490">Total impressions</text>
    <text x="354" y="246" font-size="26" font-weight="700" fill="#164e63">642K</text>
    <text x="466" y="246" font-size="11" fill="#059669">▲ 8.1%</text>

    <rect x="602" y="190" width="250" height="86" rx="12" fill="#f0fdf4"/>
    <text x="620" y="214" font-size="11" fill="#15803d">Average CTR</text>
    <text x="620" y="246" font-size="26" font-weight="700" fill="#14532d">2.9%</text>
    <text x="716" y="246" font-size="11" fill="#dc2626">▼ 0.4%</text>

    <rect x="868" y="190" width="250" height="86" rx="12" fill="#fff7ed"/>
    <text x="886" y="214" font-size="11" fill="#c2410c">Average position</text>
    <text x="886" y="246" font-size="26" font-weight="700" fill="#7c2d12">8.7</text>
    <text x="982" y="246" font-size="11" fill="#059669">▲ 1.2</text>
  </g>

  <!-- Filters -->
  <g font-family="Inter, Segoe UI, sans-serif">
    <rect x="70" y="298" width="240" height="34" rx="17" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="86" y="319" font-size="11" fill="#475569">Query contains “search console”</text>
    <text x="288" y="319" font-size="11" fill="#94a3b8">×</text>

    <rect x="322" y="298" width="210" height="34" rx="17" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="338" y="319" font-size="11" fill="#475569">Page contains “/guides/”</text>
    <text x="510" y="319" font-size="11" fill="#94a3b8">×</text>

    <rect x="544" y="298" width="168" height="34" rx="17" fill="#eef2ff" stroke="#c7d2fe"/>
    <text x="560" y="319" font-size="11" fill="#4338ca">+ Add filter</text>

    <rect x="930" y="298" width="190" height="34" rx="17" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="946" y="319" font-size="11" fill="#475569">Last 28 days · Compare</text>
  </g>

  <!-- Chart -->
  <g>
    <line x1="72" y1="612" x2="1120" y2="612" stroke="#e2e8f0"/>
    <line x1="72" y1="534" x2="1120" y2="534" stroke="#f1f5f9"/>
    <line x1="72" y1="456" x2="1120" y2="456" stroke="#f1f5f9"/>
    <line x1="72" y1="378" x2="1120" y2="378" stroke="#f1f5f9"/>
    <line x1="72" y1="300" x2="1120" y2="300" stroke="#f1f5f9"/>

    <g fill="url(#bar)" opacity=".85">
      <rect x="82" y="470" width="30" height="142" rx="4"/>
      <rect x="128" y="440" width="30" height="172" rx="4"/>
      <rect x="174" y="492" width="30" height="120" rx="4"/>
      <rect x="220" y="430" width="30" height="182" rx="4"/>
      <rect x="266" y="456" width="30" height="156" rx="4"/>
      <rect x="312" y="398" width="30" height="214" rx="4"/>
      <rect x="358" y="420" width="30" height="192" rx="4"/>
      <rect x="404" y="366" width="30" height="246" rx="4"/>
      <rect x="450" y="390" width="30" height="222" rx="4"/>
      <rect x="496" y="342" width="30" height="270" rx="4"/>
      <rect x="542" y="372" width="30" height="240" rx="4"/>
      <rect x="588" y="330" width="30" height="282" rx="4"/>
      <rect x="634" y="352" width="30" height="260" rx="4"/>
      <rect x="680" y="306" width="30" height="306" rx="4"/>
      <rect x="726" y="336" width="30" height="276" rx="4"/>
      <rect x="772" y="318" width="30" height="294" rx="4"/>
      <rect x="818" y="356" width="30" height="256" rx="4"/>
      <rect x="864" y="326" width="30" height="286" rx="4"/>
      <rect x="910" y="348" width="30" height="264" rx="4"/>
      <rect x="956" y="372" width="30" height="240" rx="4"/>
      <rect x="1002" y="352" width="30" height="260" rx="4"/>
      <rect x="1048" y="386" width="30" height="226" rx="4"/>
      <rect x="1094" y="370" width="30" height="242" rx="4"/>
    </g>

    <polyline points="97,486 143,462 189,506 235,448 281,470 327,416 373,436 419,386 465,406 511,360 557,388 603,348 649,368 695,324 741,350 787,334 833,368 879,342 925,362 971,384 1017,366 1063,398 1109,384"
      fill="none" stroke="#4f46e5" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Legend -->
  <g font-family="Inter, Segoe UI, sans-serif" font-size="10" fill="#64748b">
    <rect x="72" y="632" width="10" height="10" rx="2" fill="#6366f1"/>
    <text x="88" y="641">Clicks</text>
    <line x1="136" y1="637" x2="156" y2="637" stroke="#4f46e5" stroke-width="2"/>
    <text x="162" y="641">Impressions (trend)</text>
    <text x="1020" y="641">May 1 – May 28</text>
  </g>

  <!-- Right table snippet -->
  <rect x="914" y="318" width="214" height="124" rx="10" fill="#ffffff" stroke="#e2e8f0"/>
  <g font-family="Inter, Segoe UI, sans-serif">
    <text x="930" y="338" font-size="10" font-weight="600" fill="#64748b">TOP QUERIES</text>
    <text x="930" y="364" font-size="11" fill="#334155">search console api</text>
    <text x="1112" y="364" font-size="11" fill="#64748b" text-anchor="end">2,840</text>
    <text x="930" y="390" font-size="11" fill="#334155">gsc indexing report</text>
    <text x="1112" y="390" font-size="11" fill="#64748b" text-anchor="end">2,107</text>
    <text x="930" y="416" font-size="11" fill="#334155">canonical tag seo</text>
    <text x="1112" y="416" font-size="11" fill="#64748b" text-anchor="end">1,692</text>
  </g>
</svg>
